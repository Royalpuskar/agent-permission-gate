<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Workflow graph editor | Permission Gate</title><style>
body{font:16px system-ui;max-width:920px;margin:auto;padding:24px;background:#101820;color:#e4edf4}textarea,input,button{font:inherit;padding:10px;border:1px solid #6b7d8e;border-radius:6px}textarea{width:95%;min-height:210px;background:#17232e;color:inherit}button{cursor:pointer;margin:8px 0}article{border:1px solid #6b7d8e;border-radius:8px;padding:12px;margin:8px 0}a{color:#9dd8ff}#error{color:#ffb0a0}small{display:block}
</style></head><body><a href="index.html">Permission Gate</a><h1>Workflow graph editor</h1><p>Edit ordered steps and visualize dependencies. This page does not evaluate permissions or execute tools.</p><label for="plan">Workflow JSON</label><textarea id="plan">[{"id":"research","depends_on":[]},{"id":"review","depends_on":["research"]},{"id":"publish","depends_on":["review"]}]</textarea><button id="add">Add step</button> <button id="draw">Validate and visualize</button> <button id="save">Export JSON</button><p id="error" role="alert"></p><section id="graph" aria-live="polite"></section><script type="module">
const plan=document.querySelector('#plan'), graph=document.querySelector('#graph'), error=document.querySelector('#error');
function parse(){const rows=JSON.parse(plan.value);if(!Array.isArray(rows)||rows.length>200)throw Error('Expected at most 200 steps');const known=new Set();for(const r of rows){if(typeof r.id!=='string'||!r.id||known.has(r.id))throw Error('Invalid or duplicate ID');if(!Array.isArray(r.depends_on)||r.depends_on.some(d=>!known.has(d)))throw Error('Dependencies must reference earlier steps');known.add(r.id)}return rows}
function draw(){graph.replaceChildren();error.textContent='';try{for(const r of parse()){const node=document.createElement('article');const title=document.createElement('strong');title.textContent=r.id;const sub=document.createElement('small');sub.textContent='Depends on: '+(r.depends_on.join(', ')||'none');node.append(title,sub);graph.append(node)}}catch(e){error.textContent=e.message}}
document.querySelector('#draw').onclick=draw;
document.querySelector('#add').onclick=()=>{try{const rows=parse();let i=rows.length+1;while(rows.some(r=>r.id==='step-'+i))i++;rows.push({id:'step-'+i,depends_on:rows.length?[rows.at(-1).id]:[]});plan.value=JSON.stringify(rows,null,2);draw()}catch(e){error.textContent=e.message}};
document.querySelector('#save').onclick=()=>{try{const url=URL.createObjectURL(new Blob([JSON.stringify(parse(),null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='workflow.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){error.textContent=e.message}};
draw();
</script></body></html>
